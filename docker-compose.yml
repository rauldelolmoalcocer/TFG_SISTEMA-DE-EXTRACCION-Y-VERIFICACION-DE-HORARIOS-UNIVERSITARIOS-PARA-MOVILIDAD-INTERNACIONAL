services:
  frontend:
    build: ./frontend-flask
    container_name: tfg_frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    environment:
      # Debe coincidir con el del backend. Cambiar por un valor propio.
      - INTERNAL_API_KEY=tfg-internal-key-cambiar

  backend:
    build: ./backend-fastapi
    container_name: tfg_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - ENABLE_LLM_REVIEW=false
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Debe coincidir con el del frontend. Cambiar por un valor propio.
      - INTERNAL_API_KEY=tfg-internal-key-cambiar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/data/downloaded_pdfs
      - ./extracted:/data/extracted_json

  db:
    image: postgres:15
    container_name: tfg_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tfg
    volumes:
      # Todo lo que hay dentro de db/init/ se ejecuta, en orden alfabético,
      # SOLO la primera vez que este servicio arranca sobre un volumen
      # "pgdata" vacío (comportamiento estándar de la imagen oficial
      # postgres, docker-entrypoint-initdb.d). No se re-ejecuta en
      # arranques posteriores aunque se añadan ficheros nuevos.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: tfg_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data: